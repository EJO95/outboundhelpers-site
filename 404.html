<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — BlueCollarAI</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  :root{
    --bg:#ffffff;
    --ink:#161b22;
    --ink-soft:#3f4852;
    --accent:#1d4ed8;
    --accent-dark:#1534a0;
    --space-3:24px;
    --space-6:64px;
    --max:600px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);
    background:var(--bg);
    line-height:1.6;
    font-size:17px;
    display:flex;
    align-items:center;
    min-height:100vh;
  }
  a{color:var(--accent);text-decoration:underline;font-weight:600;}
  a:hover{color:var(--accent-dark);}
  a:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:2px;}
  .wrap{max-width:var(--max);margin:0 auto;padding:var(--space-6) var(--space-3);text-align:center;}
  h1{font-size:2rem;margin:0 0 var(--space-3);letter-spacing:-0.01em;}
  p{color:var(--ink-soft);margin:0 0 var(--space-3);}
</style>
</head>
<body>
<div class="wrap">
  <h1>Page not found</h1>
  <p>The page you're looking for doesn't exist or has moved.</p>
  <p><a href="index.html">Back to BlueCollarAI home</a></p>
</div>
</body>
</html>
